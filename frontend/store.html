<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HONEYBAIL | Small Treats, Big Happiness</title>
<link rel="icon" href="data:,">
<style>
:root{
  --ink:#2b5b78;        /* headings / text */
  --accent:#3a8db3;     /* eyebrow labels */
  --muted:#76909f;
  --line:#c5e4f2;
  --soft:#d9f0fc;
  --bg:#f3faff;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}                      /* compact base size */
body{font-family:"Segoe UI",Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg);line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer}
img{max-width:100%;display:block}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* ---------- TOP BAR ---------- */
.topbar{background:#fff;border-bottom:1px solid #e3eef5;height:54px;position:sticky;top:0;z-index:10}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:100%}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:2px;color:var(--ink)}
.brand span{font-size:20px;letter-spacing:0}
.nav{display:flex;gap:8px}
.pill{height:32px;padding:0 13px;border:1px solid var(--line);background:#fff;border-radius:10px;
  font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.pill:hover{background:#eef8fe}
.count{background:var(--soft);border-radius:10px;min-width:20px;height:20px;padding:0 6px;
  display:inline-grid;place-items:center;font-size:11px}

/* ---------- HERO ---------- */
.hero{background:linear-gradient(115deg,#fbfeff 0%,#eaf7fd 45%,#c9ebfc 100%);border-bottom:1px solid #dcecf5}
.hero .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-top:22px;padding-bottom:22px;min-height:190px}
.eyebrow{font-size:10.5px;font-weight:800;letter-spacing:2px;color:var(--accent);text-transform:uppercase}
.hero h1{font-size:30px;line-height:1.1;margin:6px 0 8px;color:var(--ink)}
.hero p{color:var(--muted);font-size:13px;margin-bottom:14px}
.hero .pill{height:34px}
.donut{font-size:92px;line-height:1;filter:drop-shadow(0 8px 8px #0002);flex:none;padding-right:10%}

/* ---------- NOTICE ---------- */
.notice{margin:16px 0 0;padding:11px 16px;background:#d9f0fc;border:1px solid var(--line);border-radius:10px;font-size:13px}
.hidden{display:none}

/* ---------- PRODUCTS ---------- */
.section{padding:22px 0 40px}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px}
.section-head h2{font-size:22px;line-height:1.15;color:var(--ink)}
.section-head p{color:var(--muted);font-size:12.5px;margin-top:2px}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.cats .pill.active{background:var(--ink);color:#fff;border-color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:#fff;border:1px solid #dcecf5;border-radius:12px;padding:12px;position:relative;
  box-shadow:0 4px 14px #1a5b8410;display:flex;flex-direction:column}
.card .fav{position:absolute;top:8px;right:10px;background:none;border:0;font-size:17px;color:var(--accent)}
.card .pic{height:104px;display:grid;place-items:center;font-size:54px;margin:4px 0 8px}
.card .pic img{height:104px;width:100%;object-fit:contain}
.card h3{font-size:13.5px}
.card .cat{font-size:11px;color:var(--muted)}
.card .price{font-weight:800;font-size:15px;margin:4px 0 8px}
.card .add{margin-top:auto;height:32px;border-radius:16px;border:1px solid var(--line);background:#eaf7fd;font-weight:700;font-size:12px}
.card .add:hover{background:#d9f0fc}
.card .add:disabled{opacity:.5;cursor:not-allowed}
.msg{color:var(--ink);font-size:13px;max-width:340px;padding:6px 0}
.msg.err{color:#b3303b}

/* ---------- LOGIN / TOAST ---------- */
.backdrop{position:fixed;inset:0;background:#0f2a3ca8;z-index:30;display:grid;place-items:center;padding:20px}
.modal{background:#fff;width:min(380px,100%);border-radius:14px;padding:20px}
.modal h2{font-size:18px;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.field label{font-size:12px;font-weight:700}
.field input{border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit;outline:none}
.row{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.solid{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:700}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1d6b4a;color:#fff;padding:10px 16px;border-radius:8px;z-index:40;font-size:13px}
.toast.err{background:#b3303b}

/* ---------- RESPONSIVE ---------- */
@media (max-width:900px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .donut{font-size:70px;padding-right:0}
}
@media (max-width:620px){
  .wrap{padding:0 12px}
  .topbar{height:auto;padding:8px 0}
  .topbar .wrap{flex-direction:column;gap:8px}
  .nav{flex-wrap:wrap;justify-content:center}
  .hero h1{font-size:24px}
  .donut{display:none}
  .section-head{flex-direction:column;align-items:flex-start}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <div class="brand"><span>🍩</span>HONEYBAIL</div>
    <nav class="nav">
      <button class="pill" data-go="shop">Shop</button>
      <button class="pill" id="favBtn">♡ Favorites</button>
      <button class="pill" id="cartBtn">🛒 Cart <span class="count" id="cartCount">0</span></button>
      <button class="pill" id="ordersBtn">My Orders</button>
      <button class="pill" id="loginBtn">Login</button>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <div>
      
      <h1>Small Treats,<br>Big Happiness.</h1>
      
      <button class="pill" data-go="shop">Explore Treats ↓</button>
    </div>
    <div class="donut">🍩</div>
  </div>
</section>

<main class="wrap">
  <div class="notice hidden" id="notice">Some storefront data could not be loaded. Check the Django server and browser console.</div>

  <section class="section" id="shop">
    <div class="section-head">
      <div>
        <div class="eyebrow">Handpicked for you</div>
        <h2>Our Products</h2>
        <p>Fresh favorites from our Honeybail collection.</p>
      </div>
      <button class="pill" id="refreshBtn">↻ Refresh</button>
    </div>
    <div class="cats" id="cats"></div>
    <div class="grid" id="grid"><p class="msg">Loading...</p></div>
  </section>
</main>

<div id="modalRoot"></div>

<script>
/* ============ CONFIG ============ */
const API_ORIGIN = window.DJANGO_API_URL || `${location.protocol}//${location.hostname}:8000`;
const API = {
  products:  `${API_ORIGIN}/api/products/`,    // -> { products: [...] }
  me:        `${API_ORIGIN}/api/auth/me/`,     // -> { user: {...} }
  login:     `${API_ORIGIN}/api/auth/login/`,
  logout:    `${API_ORIGIN}/api/auth/logout/`,
  csrf:      `${API_ORIGIN}/api/csrf/`,
  cart:      `${API_ORIGIN}/api/cart/`,        // GET items, POST {product_id, quantity}
  favorites: `${API_ORIGIN}/api/favorites/`    // GET list, POST {product_id}, DELETE <id>/
};
const CART_PAGE = "cart.html", ORDERS_PAGE = "orders.html";
/* ================================ */

const $ = id => document.getElementById(id);
const state = { products: [], favorites: new Set(), category: "all", favOnly: false, user: null };

const money = n => "₱" + Number(n || 0).toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const imgSrc = u => !u ? "" : /^(https?:|data:)/.test(u) ? u : API_ORIGIN + (u.startsWith("/") ? "" : "/") + u;
const catOf = p => p.category || "Others";

function toast(msg, err) {
  const n = document.createElement("div");
  n.className = "toast" + (err ? " err" : "");
  n.textContent = msg;
  document.body.appendChild(n);
  setTimeout(() => n.remove(), 3000);
}

/* ---------- API (session cookie + CSRF, same as the admin panel) ---------- */
const getCookie = name => {
  const part = document.cookie.split("; ").find(x => x.startsWith(name + "="));
  return part ? decodeURIComponent(part.slice(name.length + 1)) : null;
};
async function csrf() {
  await fetch(API.csrf, { credentials: "include" });
  const t = getCookie("csrftoken");
  if (!t) throw new Error("CSRF cookie missing. Use 127.0.0.1 for both the page and Django.");
  return t;
}
async function request(url, opts = {}) {
  const method = (opts.method || "GET").toUpperCase();
  const headers = new Headers(opts.headers || {});
  if (!["GET", "HEAD", "OPTIONS"].includes(method)) headers.set("X-CSRFToken", await csrf());
  let res;
  try { res = await fetch(url, { ...opts, method, headers, credentials: "include" }); }
  catch { throw new Error("Cannot connect to Django. Check that runserver is running."); }
  let body = {};
  try { body = await res.json(); } catch {}
  if (!res.ok) throw new Error(body.error || `Request failed (${res.status})`);
  return body;
}
const jsonOpts = (method, data) => ({ method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });

/* ---------- RENDER ---------- */
function renderCats() {
  const cats = [...new Set(state.products.map(catOf))].sort();
  $("cats").innerHTML = cats.length
    ? [`<button class="pill ${state.category === "all" ? "active" : ""}" data-cat="all">All</button>`]
        .concat(cats.map(c => `<button class="pill ${state.category === c ? "active" : ""}" data-cat="${esc(c)}">${esc(c)}</button>`)).join("")
    : "";
}
function renderGrid() {
  const items = state.products.filter(p =>
    (!state.favOnly || state.favorites.has(p.id)) &&
    (state.category === "all" || catOf(p) === state.category));
  $("grid").innerHTML = items.length ? items.map(p => {
    const out = Number(p.stock ?? 1) <= 0;
    const pic = p.image
      ? `<img src="${esc(imgSrc(p.image))}" alt="${esc(p.name)}" onerror="this.outerHTML='🍩'">`
      : "🍩";
    return `<div class="card">
      <button class="fav" data-fav="${p.id}" title="Favorite">${state.favorites.has(p.id) ? "♥" : "♡"}</button>
      <div class="pic">${pic}</div>
      <h3>${esc(p.name)}</h3>
      <div class="cat">${esc(catOf(p))}</div>
      <div class="price">${money(p.price)}</div>
      <button class="add" data-add="${p.id}" ${out ? "disabled" : ""}>${out ? "Out of stock" : "🛒 Add to Cart"}</button>
    </div>`;
  }).join("") : `<p class="msg">${state.favOnly ? "No favorites yet." : "No products found."}</p>`;
}

/* ---------- DATA ---------- */
async function loadProducts() {
  try {
    const d = await request(API.products);
    state.products = Array.isArray(d.products) ? d.products : [];
    $("notice").classList.add("hidden");
    renderCats(); renderGrid();
  } catch (e) {
    $("notice").classList.remove("hidden");
    $("grid").innerHTML = `<p class="msg err">Unable to load products: ${esc(e.message)}</p>`;
    $("cats").innerHTML = "";
  }
}
async function loadUser() {
  try { state.user = (await request(API.me)).user || null; } catch { state.user = null; }
  $("loginBtn").textContent = state.user ? "Logout" : "Login";
  if (!state.user) { state.favorites = new Set(); $("cartCount").textContent = 0; renderGrid(); return; }
  try {
    const d = await request(API.favorites);
    const arr = d.favorites || d.items || (Array.isArray(d) ? d : []);
    state.favorites = new Set(arr.map(f => f.product_id ?? (f.product && f.product.id) ?? f.product ?? f.id));
  } catch { state.favorites = new Set(); }
  try {
    const d = await request(API.cart);
    const items = d.items || (d.cart && d.cart.items) || (Array.isArray(d) ? d : []);
    $("cartCount").textContent = items.reduce((a, i) => a + Number(i.quantity || 1), 0);
  } catch { $("cartCount").textContent = 0; }
  renderGrid();
}

/* ---------- ACTIONS ---------- */
async function addToCart(id) {
  if (!state.user) return loginModal();
  try {
    await request(API.cart, jsonOpts("POST", { product_id: id, quantity: 1 }));
    $("cartCount").textContent = Number($("cartCount").textContent) + 1;
    toast("Added to cart.");
  } catch (e) { toast(e.message, true); }
}
async function toggleFav(id) {
  if (!state.user) return loginModal();
  const on = state.favorites.has(id);
  try {
    if (on) await request(`${API.favorites}${id}/`, { method: "DELETE" });
    else await request(API.favorites, jsonOpts("POST", { product_id: id }));
    on ? state.favorites.delete(id) : state.favorites.add(id);
    renderGrid();
  } catch (e) { toast(e.message, true); }
}
function loginModal() {
  $("modalRoot").innerHTML = `<div class="backdrop"><form class="modal" id="loginForm">
    <h2>Sign In</h2>
    <div class="field"><label>Email / username</label><input name="email" required autocomplete="username"></div>
    <div class="field"><label>Password</label><input name="password" type="password" required autocomplete="current-password"></div>
    <div class="row"><button type="button" class="pill" id="cancelLogin">Cancel</button><button class="solid">Sign In</button></div>
  </form></div>`;
  $("cancelLogin").onclick = () => $("modalRoot").innerHTML = "";
  $("loginForm").onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    try {
      await request(API.login, jsonOpts("POST", { email: fd.get("email"), password: fd.get("password") }));
      $("modalRoot").innerHTML = "";
      await loadUser();
      toast("Signed in successfully.");
    } catch (err) { toast(err.message, true); }
  };
}

/* ---------- EVENTS ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.go) $(t.dataset.go).scrollIntoView({ behavior: "smooth" });
  if (t.dataset.cat) { state.category = t.dataset.cat; state.favOnly = false; renderCats(); renderGrid(); }
  if (t.dataset.add) addToCart(Number(t.dataset.add));
  if (t.dataset.fav) toggleFav(Number(t.dataset.fav));
});
$("refreshBtn").onclick = async () => { await loadProducts(); await loadUser(); };
$("favBtn").onclick = () => {
  if (!state.user) return loginModal();
  state.favOnly = !state.favOnly;
  $("favBtn").style.background = state.favOnly ? "#d9f0fc" : "";
  renderGrid();
  $("shop").scrollIntoView({ behavior: "smooth" });
};
$("cartBtn").onclick = () => state.user ? (location.href = CART_PAGE) : loginModal();
$("ordersBtn").onclick = () => state.user ? (location.href = ORDERS_PAGE) : loginModal();
$("loginBtn").onclick = async () => {
  if (!state.user) return loginModal();
  if (!confirm("Sign out of HONEYBAIL?")) return;
  try { await request(API.logout, { method: "POST" }); } catch {}
  await loadUser();
};

(async () => { await loadProducts(); await loadUser(); })();
</script>
</body>
</html>
