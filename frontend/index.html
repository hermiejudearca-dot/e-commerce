<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Honeybail | Admin Panel</title>
<style>
:root{--red:#a90f1a;--red2:#c51c28;--cream:#fffaf6;--ink:#29252a;--muted:#7c7778;--line:#eee5e1;--green:#dff5e6;--orange:#fff0d8;--blue:#e3efff;--shadow:0 8px 28px #4b10100b}
*{box-sizing:border-box}body{margin:0;background:#faf8f6;color:var(--ink);font:14px/1.45 Inter,Segoe UI,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.topbar{height:64px;background:linear-gradient(90deg,#970b16,#b81723);color:white;display:flex;align-items:center;gap:18px;padding:0 22px;position:sticky;top:0;z-index:5;box-shadow:0 3px 12px #6b000020}.brand{font-weight:900;letter-spacing:1.5px;font-size:20px;line-height:1}.brand small{display:block;font-size:8px;letter-spacing:.6px;margin-top:4px}.hamb{background:transparent;color:white;border:0;font-size:23px}.top-title{font-size:13px;opacity:.95}.top-right{margin-left:auto;display:flex;align-items:center;gap:16px}.top-right button{background:transparent;border:0;color:white}.layout{display:flex;min-height:calc(100vh - 64px)}.sidebar{width:220px;flex-shrink:0;background:#970d17;color:#fff;padding:16px 10px;display:flex;flex-direction:column;gap:5px}.navbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-radius:8px;background:transparent;color:#f9e9e9;padding:12px 13px;font-size:13px;transition:.18s}.navbtn:hover,.navbtn.active{background:#c32732;color:white}.navbtn .ico{width:20px;font-size:17px;text-align:center}.nav-spacer{flex:1;min-height:24px}.backstore{border-top:1px solid #ffffff26;padding-top:14px;margin-top:8px}.main{padding:25px;flex:1;min-width:0;max-width:1800px;margin:0 auto;width:100%}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:20px}.pagehead h1{font-size:24px;margin:0 0 4px}.sub{color:var(--muted);font-size:13px}.datepill{background:white;border:1px solid var(--line);padding:9px 12px;border-radius:9px;color:#8e151e}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.stat,.panel,.tablewrap{background:white;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}.stat{padding:18px;display:flex;gap:13px;align-items:center}.stat-icon{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:#f9e5e5;color:var(--red);font-size:20px}.stat-label{font-size:12px;color:var(--muted)}.stat strong{display:block;font-size:22px;margin:3px 0}.positive{font-size:11px;color:#19864a}.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-bottom:16px}.grid3{display:grid;grid-template-columns:1.2fr 1fr .8fr;gap:16px;margin-bottom:16px}.panel{padding:18px;min-width:0}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.panelhead h3{margin:0;font-size:15px}.linkbtn{border:0;background:transparent;color:var(--red);font-weight:700;font-size:12px}.chart{height:205px;width:100%;display:block}.recent-list{display:flex;flex-direction:column;gap:0}.recent-row{display:grid;grid-template-columns:1.1fr 1fr .6fr .7fr;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #f3eeeb;font-size:11px}.recent-row:last-child{border:0}.badge{display:inline-block;border-radius:5px;padding:4px 8px;font-size:11px;font-weight:700;white-space:nowrap}.Pending{background:var(--orange);color:#b86a08}.Paid,.In-Stock{background:var(--green);color:#168046}.Shipped{background:var(--blue);color:#1761b0}.Cancelled,.Low-Stock{background:#ffe6e3;color:#bf392b}.tablewrap{overflow:auto}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{border:1px solid #e6dedb;background:#fff;border-radius:8px;padding:10px 12px;outline:none;min-width:140px}.toolbar input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:#c52a35;box-shadow:0 0 0 3px #c52a3510}.primary,.secondary,.danger{border:0;border-radius:8px;padding:10px 14px;font-weight:700}.primary{background:var(--red);color:white}.primary:hover{background:#830a13}.secondary{background:#f6ecea;color:#8f111a}.danger{background:#ffeded;color:#b51a25}.table{border-collapse:collapse;width:100%;white-space:nowrap}.table th{background:#fffaf8;color:#777;font-size:11px;text-align:left;padding:13px 15px}.table td{padding:13px 15px;border-top:1px solid #f0eae7;font-size:12px}.table tr:hover td{background:#fffdfc}.actions{display:flex;gap:6px}.smallbtn{border:1px solid #eee0dc;background:white;border-radius:6px;padding:5px 8px;color:#7f111a}.smallbtn:hover{background:#fff0ef}.product-cell{display:flex;align-items:center;gap:10px}.product-emoji{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;background:#fff0e8;font-size:20px}.empty{text-align:center;color:var(--muted);padding:35px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;font-weight:700}.field.full{grid-column:1/-1}.field textarea{min-height:85px}.settings-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab{border:1px solid var(--line);border-radius:8px;padding:9px 14px;background:white}.tab.active{background:var(--red);color:white;border-color:var(--red)}.setting-layout{display:grid;grid-template-columns:200px 1fr;gap:25px}.store-logo{width:110px;height:110px;background:#f7e4e2;color:var(--red);border-radius:50%;display:grid;place-items:center;font-size:42px;margin-bottom:12px}.mutedbox{background:#fff9f6;border:1px solid var(--line);padding:14px;border-radius:9px;color:var(--muted)}.bar-chart{height:220px;display:flex;align-items:end;gap:13px;padding:12px 8px 0;border-bottom:1px solid var(--line)}.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%;gap:7px;font-size:10px;color:var(--muted)}.bar{width:70%;max-width:40px;background:linear-gradient(#d93642,#a70d19);border-radius:5px 5px 0 0;min-height:6px}.bar-label{padding-bottom:8px}.quick-actions{display:grid;gap:9px}.quick-actions button{text-align:left;background:#fff8f6;border:1px solid #f4e2df;border-radius:8px;padding:12px;color:#8e121c}.footer{padding:18px 0 0;color:#a49b98;font-size:11px;display:flex;justify-content:space-between}.notice{padding:12px 14px;border-radius:8px;background:#e5f7e9;color:#166b37;margin-bottom:14px}.modal-backdrop{position:fixed;inset:0;background:#1e1010a8;z-index:20;display:grid;place-items:center;padding:20px}.modal{background:white;width:min(560px,100%);max-height:90vh;overflow:auto;border-radius:14px;padding:22px;box-shadow:0 20px 70px #0003}.modalhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.modalhead h2{margin:0;font-size:19px}.close{border:0;background:#f6eeee;border-radius:7px;padding:6px 10px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.hidden{display:none!important}.mobile-overlay{display:none}
@media(max-width:1050px){.sidebar{width:190px}.main{padding:18px}.stats{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr 1fr}.grid3 .panel:last-child{grid-column:1/-1}}
@media(max-width:720px){.topbar{padding:0 13px}.brand{font-size:16px}.top-title{display:none}.sidebar{position:fixed;z-index:10;top:64px;bottom:0;left:0;transform:translateX(-100%);transition:.2s;width:245px}.sidebar.open{transform:translateX(0)}.mobile-overlay.show{display:block;position:fixed;inset:64px 0 0;background:#0006;z-index:9}.main{padding:15px}.stats{grid-template-columns:1fr 1fr;gap:9px}.stat{padding:12px;gap:8px}.stat-icon{width:34px;height:34px}.stat strong{font-size:18px}.grid2,.grid3{grid-template-columns:1fr}.grid3 .panel:last-child{grid-column:auto}.pagehead h1{font-size:21px}.setting-layout{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.datepill{display:none}}
</style></head>
<body><div class="app">
<header class="topbar"><button class="hamb" id="menuToggle" aria-label="Toggle menu">☰</button><div class="brand">HONEYBAIL<small>✦ SMALL TREATS, BIG HAPPINESS ✦</small></div><div class="top-title">Admin Panel</div><div class="top-right"><button id="notificationBtn" title="Notifications">♧</button><button id="adminMenu">◉ Admin⌄</button></div></header>
<div class="mobile-overlay" id="overlay"></div>
<div class="layout"><aside class="sidebar" id="sidebar">
<button class="navbtn active" data-page="dashboard"><span class="ico">⌂</span>Dashboard</button>
<button class="navbtn" data-page="orders"><span class="ico">▣</span>Orders</button>
<button class="navbtn" data-page="products"><span class="ico">◉</span>Products</button>
<button class="navbtn" data-page="customers"><span class="ico">♟</span>Customers</button>
<button class="navbtn" data-page="reports"><span class="ico">▥</span>Reports</button>
<button class="navbtn" data-page="cart"><span class="ico">🛒</span>Cart Activity</button>
<button class="navbtn" data-page="favorites"><span class="ico">♡</span>Favorites</button>
<button class="navbtn" data-page="settings"><span class="ico">⚙</span>Settings</button>
<div class="nav-spacer"></div><button class="navbtn backstore" id="backStore"><span class="ico">↗</span>Back to Store</button>
</aside><main class="main" id="main"></main></div></div>
<div id="modalRoot"></div>
<script>

const defaultProducts=[
{id:1,name:'Chocolate Sprinkle',category:'Chocolate',price:20,stock:12,emoji:'🍩'},
{id:2,name:'Strawberry Glazed',category:'Fruity',price:20,stock:10,emoji:'🍩'},
{id:3,name:'Cookies & Cream',category:'Cream-filled',price:25,stock:8,emoji:'🍩'},
{id:4,name:'Choco Peanut',category:'Nutty',price:25,stock:6,emoji:'🍩'},
{id:5,name:'Classic Glazed',category:'Glazed',price:20,stock:15,emoji:'🍩'},
{id:6,name:'Old Fashioned',category:'Specialty',price:20,stock:5,emoji:'🍩'},
{id:7,name:'Ube Glazed',category:'Fruity',price:25,stock:8,emoji:'🍩'},
{id:8,name:'Matcha Crunch',category:'Specialty',price:25,stock:4,emoji:'🍩'}];
const defaultCustomers=[
{id:'CUST-001',name:'Juan Dela Cruz',email:'juan@email.com',phone:'09171234567',orders:5,joined:'Sep 10, 2026'},
{id:'CUST-002',name:'Maria Santos',email:'maria@email.com',phone:'09177894562',orders:3,joined:'Sep 11, 2026'},
{id:'CUST-003',name:'Carlo Reyes',email:'carlo@email.com',phone:'09176543210',orders:2,joined:'Sep 12, 2026'},
{id:'CUST-004',name:'Ana Lim',email:'ana@email.com',phone:'09171239876',orders:4,joined:'Sep 13, 2026'},
{id:'CUST-005',name:'Bea Garcia',email:'bea@email.com',phone:'09171239811',orders:1,joined:'Sep 14, 2026'},
{id:'CUST-006',name:'Joel Santos',email:'joel@email.com',phone:'09176549832',orders:2,joined:'Sep 15, 2026'}];
const defaultOrders=[
{id:'ORD-0024',customer:'Juan Dela Cruz',items:2,total:60,status:'Pending',date:'Sep 20, 10:24 AM'},
{id:'ORD-0023',customer:'Maria Santos',items:1,total:100,status:'Paid',date:'Sep 20, 09:56 AM'},
{id:'ORD-0022',customer:'Carlo Reyes',items:2,total:80,status:'Paid',date:'Sep 20, 09:12 AM'},
{id:'ORD-0021',customer:'Ana Lim',items:1,total:60,status:'Shipped',date:'Sep 19, 07:45 AM'},
{id:'ORD-0020',customer:'Bea Garcia',items:1,total:40,status:'Paid',date:'Sep 19, 07:25 AM'},
{id:'ORD-0019',customer:'Joel Santos',items:3,total:120,status:'Pending',date:'Sep 18, 05:20 PM'},
{id:'ORD-0018',customer:'Liza Cruz',items:2,total:80,status:'Shipped',date:'Sep 18, 02:14 PM'},
{id:'ORD-0017',customer:'Mark Reyes',items:1,total:40,status:'Paid',date:'Sep 17, 11:32 AM'}];
function getData(k,def){try{return JSON.parse(localStorage.getItem('hb_'+k))||def}catch{return def}}
let products=getData('products',defaultProducts),customers=getData('customers',defaultCustomers),orders=getData('orders',defaultOrders);
let cartActivity=getData('cart',[['Sep 20, 10:20 AM','Juan Dela Cruz','Chocolate Sprinkle','Added to Cart',1],['Sep 20, 09:50 AM','Maria Santos','Strawberry Glazed','Added to Cart',2],['Sep 20, 09:30 AM','Carlo Reyes','Cookies & Cream','Removed from Cart',1],['Sep 20, 08:45 AM','Ana Lim','Choco Peanut','Added to Cart',1],['Sep 20, 08:20 AM','Bea Garcia','Classic Glazed','Added to Cart',3]]);
let favorites=getData('favorites',[['Juan Dela Cruz','Chocolate Sprinkle','Sep 16, 2026'],['Maria Santos','Strawberry Glazed','Sep 17, 2026'],['Carlo Reyes','Cookies & Cream','Sep 16, 2026'],['Ana Lim','Choco Peanut','Sep 15, 2026'],['Bea Garcia','Classic Glazed','Sep 13, 2026']]);
let settings=getData('settings',{name:'HONEYBAIL',tagline:'Small Treats, Big Happiness',email:'honeybail@gmail.com',phone:'0917 123 4567',address:'Brgy. San Isidro, City of Malolos, Bulacan'});
let currentPage='dashboard',orderFilter='All',productSearch='',customerSearch='',orderSearch='',settingsTab='Store Info';
const money=n=>'₱'+Number(n).toLocaleString('en-PH');
const thumb=p=>p.image?`<img src="${p.image}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:9px">`:(p.emoji||'🍩');
function readImage(file,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,300/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.8))};im.src=r.result};r.readAsDataURL(file)}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem('hb_products',JSON.stringify(products));localStorage.setItem('hb_customers',JSON.stringify(customers));localStorage.setItem('hb_orders',JSON.stringify(orders));localStorage.setItem('hb_cart',JSON.stringify(cartActivity));localStorage.setItem('hb_favorites',JSON.stringify(favorites));localStorage.setItem('hb_settings',JSON.stringify(settings))}
function badge(s){return `<span class="badge ${s.replaceAll(' ','-')}">${esc(s)}</span>`}
function head(title,sub,extra=''){return `<div class="pagehead"><div><h1>${title}</h1><div class="sub">${sub}</div></div>${extra||'<div class="datepill">▣ &nbsp; Sep 20, 2026</div>'}</div>`}
function table(headers,rows){return `<div class="tablewrap"><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">No records found.</td></tr>`}</tbody></table></div>`}
function productRows(list){return list.map(p=>`<tr><td><div class="product-cell"><span class="product-emoji">${thumb(p)}</span><b>${esc(p.name)}</b></div></td><td>${esc(p.category||'Donut')}</td><td>${money(p.price)}</td><td>${p.stock}</td><td>${badge(p.stock<=5?'Low Stock':'In Stock')}</td><td><div class="actions"><button class="smallbtn" data-action="edit-product" data-id="${p.id}">✎</button><button class="smallbtn" data-action="delete-product" data-id="${p.id}">🗑</button></div></td></tr>`).join('')}
function orderRows(list){return list.map(o=>`<tr><td><b>#${esc(o.id)}</b></td><td>${esc(o.customer)}</td><td>${o.items}</td><td>${money(o.total)}</td><td>${badge(o.status)}</td><td>${esc(o.date)}</td><td><div class="actions"><button class="smallbtn" data-action="view-order" data-id="${o.id}" title="View">◉</button><button class="smallbtn" data-action="edit-order" data-id="${o.id}" title="Update status">✎</button></div></td></tr>`).join('')}
function customerRows(list){return list.map(c=>`<tr><td>${esc(c.id)}</td><td><b>${esc(c.name)}</b></td><td>${esc(c.email)}</td><td>${esc(c.phone)}</td><td>${c.orders}</td><td>${esc(c.joined)}</td><td><button class="smallbtn" data-action="view-customer" data-id="${c.id}">◉ View</button></td></tr>`).join('')}
function chart(){return `<svg class="chart" viewBox="0 0 600 220" preserveAspectRatio="none" aria-label="Sales line chart"><defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c52a35" stop-opacity=".24"/><stop offset="100%" stop-color="#c52a35" stop-opacity="0"/></linearGradient></defs>${[35,75,115,155,195].map(y=>`<line x1="35" y1="${y}" x2="590" y2="${y}" stroke="#eee8e5" stroke-dasharray="3 4"/>`).join('')}<path d="M35 165 L115 145 L195 160 L275 175 L355 128 L435 138 L515 105 L585 72 L585 195 L35 195 Z" fill="url(#fill)"/><polyline points="35,165 115,145 195,160 275,175 355,128 435,138 515,105 585,72" fill="none" stroke="#c51c28" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${[[35,165],[115,145],[195,160],[275,175],[355,128],[435,138],[515,105],[585,72]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="4" fill="#c51c28"/>`).join('')}<text x="35" y="214" font-size="11" fill="#8a8380">Sep 14</text><text x="180" y="214" font-size="11" fill="#8a8380">Sep 16</text><text x="330" y="214" font-size="11" fill="#8a8380">Sep 18</text><text x="525" y="214" font-size="11" fill="#8a8380">Sep 20</text></svg>`}
function stat(icon,label,value,foot='↑ 12% vs. last 7 days'){return `<div class="stat"><div class="stat-icon">${icon}</div><div><div class="stat-label">${label}</div><strong>${value}</strong><div class="positive">${foot}</div></div></div>`}
function renderDashboard(){let total=orders.reduce((s,o)=>s+o.total,0);return `${head('Welcome back, Admin!','Here’s what’s happening with your store today.')}<section class="stats">${stat('▣','Total Orders',orders.length)}${stat('₱','Total Sales',money(total),'↑ 18% vs. last 7 days')}${stat('◉','Products',products.length,'● In stock')}${stat('♟','Customers',customers.length,'↑ 20% vs. last 7 days')}</section><section class="grid2"><div class="panel"><div class="panelhead"><h3>Sales Overview</h3><button class="linkbtn" data-action="go-reports">View Report →</button></div>${chart()}</div><div class="panel"><div class="panelhead"><h3>Recent Orders</h3><button class="linkbtn" data-page="orders">View All →</button></div><div class="recent-list">${orders.slice(0,5).map(o=>`<div class="recent-row"><b>#${o.id}</b><span>${esc(o.customer)}</span><span>${money(o.total)}</span>${badge(o.status)}</div>`).join('')}</div></div></section><section class="grid3"><div class="panel"><div class="panelhead"><h3>Latest Orders</h3><button class="linkbtn" data-page="orders">View All</button></div>${table(['Customer','Items','Total','Status'],orders.slice(0,4).map(o=>`<tr><td>${esc(o.customer)}</td><td>${o.items}</td><td>${money(o.total)}</td><td>${badge(o.status)}</td></tr>`).join(''))}</div><div class="panel"><div class="panelhead"><h3>Top Products</h3><button class="linkbtn" data-page="products">View All</button></div>${products.slice(0,5).map((p,i)=>`<div class="recent-row" style="grid-template-columns:32px 1fr 30px"><span class="product-emoji">${p.emoji}</span><span>${esc(p.name)}</span><b>${[12,10,8,6,5][i]||3}</b></div>`).join('')}</div><div class="panel"><div class="panelhead"><h3>Quick Actions</h3></div><div class="quick-actions"><button data-action="add-product">⊕ &nbsp; Add Product</button><button data-page="orders">▣ &nbsp; Manage Orders</button><button data-page="customers">♟ &nbsp; View Customers</button><button data-page="go-reports">▥ &nbsp; Generate Report</button></div></div></section>`}
function renderOrders(){let list=orders.filter(o=>(orderFilter==='All'||o.status===orderFilter)&&(`${o.id} ${o.customer}`).toLowerCase().includes(orderSearch.toLowerCase()));return `${head('Orders','Monitor and manage customer orders.','<button class="primary" data-action="export-orders">↓ Export CSV</button>')}<div class="toolbar"><input id="orderSearch" placeholder="⌕ Search by order ID, customer..." value="${esc(orderSearch)}"><select id="orderFilter">${['All','Pending','Paid','Shipped','Cancelled'].map(s=>`<option ${orderFilter===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="settings-tabs">${['All','Pending','Paid','Shipped','Cancelled'].map(s=>`<button class="tab ${orderFilter===s?'active':''}" data-action="filter-orders" data-value="${s}">${s} (${s==='All'?orders.length:orders.filter(o=>o.status===s).length})</button>`).join('')}</div>${table(['Order ID','Customer','Items','Total','Status','Date','Action'],orderRows(list))}`}
function renderProducts(){let list=products.filter(p=>p.name.toLowerCase().includes(productSearch.toLowerCase()));return `${head('Products','Manage your donut products and stock.','<div class="actions"><button class="secondary" data-action="export-products">Export</button><button class="primary" data-action="add-product">＋ Add Product</button></div>')}<div class="toolbar"><input id="productSearch" placeholder="⌕ Search products..." value="${esc(productSearch)}"></div>${table(['Product Name','Price','Stock','Status','Action'],productRows(list))}`}
function renderCustomers(){let list=customers.filter(c=>(c.name+' '+c.email+' '+c.id).toLowerCase().includes(customerSearch.toLowerCase()));return `${head('Customers','View and manage your registered customers.','<button class="primary" data-action="add-customer">＋ Add Customer</button>')}<div class="toolbar"><input id="customerSearch" placeholder="⌕ Search by name, email or ID..." value="${esc(customerSearch)}"></div>${table(['Customer ID','Name','Email','Phone','Total Orders','Joined','Action'],customerRows(list))}`}
function renderReports(){let total=orders.reduce((s,o)=>s+o.total,0);let values=[35,48,39,69,86,75,95];return `${head('Reports','View sales and order reports.')}<section class="stats">${stat('₱','Total Sales',money(total))}${stat('▣','Total Orders',orders.length)}${stat('♡','Average Order Value',money(orders.length?Math.round(total/orders.length):0),'Across all orders')}${stat('♟','Customers',customers.length)}</section><section class="grid2"><div class="panel"><div class="panelhead"><h3>Sales Report</h3><button class="secondary" data-action="export-orders">Export CSV</button></div><div class="bar-chart">${values.map((v,i)=>`<div class="bar-col"><div class="bar" style="height:${v}%"></div><span class="bar-label">Sep ${14+i}</span></div>`).join('')}</div></div><div class="panel"><div class="panelhead"><h3>Top Products</h3></div>${products.slice(0,6).map((p,i)=>`<div class="recent-row" style="grid-template-columns:36px 1fr 30px"><span class="product-emoji">${p.emoji}</span><span>${esc(p.name)}</span><b>${[12,10,8,6,5,4][i]}</b></div>`).join('')}</div></section><div class="panel"><div class="panelhead"><h3>Order Summary</h3></div>${table(['Status','Number of Orders','Sales Value'],['Pending','Paid','Shipped','Cancelled'].map(s=>`<tr><td>${badge(s)}</td><td>${orders.filter(o=>o.status===s).length}</td><td>${money(orders.filter(o=>o.status===s).reduce((a,o)=>a+o.total,0))}</td></tr>`).join(''))}</div>`}
function renderCart(){return `${head('Cart Activity','View recent cart activities from customers.','<button class="secondary" data-action="clear-cart">Clear Activity</button>')}${table(['Time','Customer','Product','Action','Quantity'],cartActivity.map(a=>`<tr><td>${esc(a[0])}</td><td>${esc(a[1])}</td><td>${esc(a[2])}</td><td>${badge(a[3]==='Added to Cart'?'Paid':'Cancelled')}</td><td>${a[4]}</td></tr>`).join(''))}`}
function renderFavorites(){return `${head('Favorites','Products saved by your customers.')}${table(['Customer','Product','Date Added','Action'],favorites.map((f,i)=>`<tr><td>${esc(f[0])}</td><td><div class="product-cell"><span class="product-emoji">${products.find(p=>p.name===f[1])?.emoji||'🧋'}</span>${esc(f[1])}</div></td><td>${esc(f[2])}</td><td><button class="smallbtn" data-action="remove-favorite" data-id="${i}">Remove</button></td></tr>`).join(''))}`}
function renderSettings(){return `${head('Store Settings','Manage your store information and preferences.')}<div class="settings-tabs">${['Store Info','Notifications','Payment','Shipping'].map(t=>`<button class="tab ${settingsTab===t?'active':''}" data-action="settings-tab" data-value="${t}">${t}</button>`).join('')}</div><div class="panel">${settingsTab==='Store Info'?`<div class="setting-layout"><div><div class="store-logo">🥤</div><b>${esc(settings.name)}</b><p class="sub">Store logo preview</p><button class="secondary" data-action="change-logo">Change Logo</button></div><form id="settingsForm"><div class="formgrid"><div class="field"><label>Store Name</label><input name="name" required value="${esc(settings.name)}"></div><div class="field"><label>Tagline</label><input name="tagline" value="${esc(settings.tagline)}"></div><div class="field"><label>Email</label><input type="email" name="email" value="${esc(settings.email)}"></div><div class="field"><label>Phone</label><input name="phone" value="${esc(settings.phone)}"></div><div class="field full"><label>Address</label><textarea name="address">${esc(settings.address)}</textarea></div></div><div class="modal-actions"><button class="primary">Save Changes</button></div></form></div>`:settingsTab==='Notifications'?`<h3>Notification preferences</h3>${['New order notifications','Low stock alerts','Customer messages','Weekly sales summary'].map(s=>`<p><label><input type="checkbox" checked> ${s}</label></p>`).join('')}<button class="primary" data-action="save-preferences">Save Preferences</button>`:settingsTab==='Payment'?`<h3>Payment options</h3>${['Cash on Delivery','GCash','Maya'].map(s=>`<p><label><input type="checkbox" checked> ${s}</label></p>`).join('')}<button class="primary" data-action="save-preferences">Save Preferences</button>`:`<h3>Shipping preferences</h3><div class="field"><label>Standard delivery fee (₱)</label><input id="shippingFee" type="number" min="0" value="40"></div><p><label><input type="checkbox" checked> Enable local delivery</label></p><button class="primary" data-action="save-preferences">Save Preferences</button>`}</div>`}
function render(){document.querySelectorAll('.navbtn[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===currentPage));const pages={dashboard:renderDashboard,orders:renderOrders,products:renderProducts,customers:renderCustomers,reports:renderReports,cart:renderCart,favorites:renderFavorites,settings:renderSettings};document.getElementById('main').innerHTML=(pages[currentPage]||renderDashboard)()+`<div class="footer"><span>HONEYBAIL Admin Panel · Demo frontend</span><span>Small Treats, Big Happiness ♥</span></div>`}
function go(page){currentPage=page;render();document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show');window.scrollTo(0,0)}
function modal(title,body,submitLabel='Save',onSubmit=null){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" id="modalBackdrop"><div class="modal"><div class="modalhead"><h2>${title}</h2><button class="close" data-action="close-modal">✕</button></div><form id="modalForm">${body}<div class="modal-actions"><button type="button" class="secondary" data-action="close-modal">Cancel</button><button class="primary" type="submit">${submitLabel}</button></div></form></div></div>`;document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});document.getElementById('modalForm').addEventListener('submit',e=>{e.preventDefault();if(onSubmit)onSubmit(new FormData(e.target));closeModal()})}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function productForm(p={name:'',category:'Glazed',price:'',stock:0,image:''},isEdit=false){
const cats=['Chocolate','Fruity','Glazed','Cream-filled','Nutty','Specialty'];
let img=p.image||'';
modal(isEdit?'Edit product':'Add a product',`<div class="formgrid">
<div class="field"><label>Product name *</label><input name="name" required placeholder="e.g. Strawberry Glazed" value="${esc(p.name)}"></div>
<div class="field"><label>Category *</label><select name="category" required>${cats.map(c=>`<option ${(p.category||'Glazed')===c?'selected':''}>${c}</option>`).join('')}</select></div>
<div class="field"><label>Price (₱) *</label><input name="price" type="number" min="0" step=".01" required placeholder="25.00" value="${p.price}"></div>
<div class="field"><label>Stock quantity *</label><input name="stock" type="number" min="0" required value="${p.stock}"></div>
<div class="field full"><label>Product image (JPG, PNG, WEBP)</label><input type="file" id="pImage" accept=".jpg,.jpeg,.png,.webp"><img id="pPreview" class="thumb-preview ${img?'':'hidden'}" src="${img}" alt=""></div>
</div>`,'+ Save product',fd=>{
const data={name:fd.get('name').trim(),category:fd.get('category'),price:Number(fd.get('price')),stock:Number(fd.get('stock')),image:img};
if(isEdit){Object.assign(products.find(x=>x.id===p.id),data)}else{products.unshift({id:Date.now(),emoji:'🍩',...data})}
save();render();toast('Product saved successfully.')});
document.getElementById('pImage').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;readImage(f,d=>{img=d;const pv=document.getElementById('pPreview');pv.src=d;pv.classList.remove('hidden')})});
}
function toast(msg){const n=document.createElement('div');n.className='notice';n.textContent=msg;document.getElementById('main').prepend(n);setTimeout(()=>n.remove(),2600)}
function downloadCSV(filename,rows){const csv=rows.map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download=filename;a.click();URL.revokeObjectURL(a.href)}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){go(nav.dataset.page);return}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;
switch(a){
case 'add-product':productForm();break;
case 'edit-product':{const p=products.find(x=>String(x.id)===id);if(p)productForm(p,true);break}
case 'delete-product':if(confirm('Delete this product?')){products=products.filter(p=>String(p.id)!==id);save();render();toast('Product deleted.')}break;
case 'add-customer':modal('Add Customer',`<div class="formgrid"><div class="field full"><label>Full Name</label><input name="name" required></div><div class="field full"><label>Email</label><input name="email" type="email" required></div><div class="field full"><label>Phone</label><input name="phone" required></div></div>`,'Add Customer',fd=>{customers.unshift({id:'CUST-'+String(Date.now()).slice(-4),name:fd.get('name'),email:fd.get('email'),phone:fd.get('phone'),orders:0,joined:new Date().toLocaleDateString()});save();render();toast('Customer added.')});break;
case 'view-customer':{const c=customers.find(x=>x.id===id);if(c)modal('Customer Details',`<p><b>ID:</b> ${esc(c.id)}</p><p><b>Name:</b> ${esc(c.name)}</p><p><b>Email:</b> ${esc(c.email)}</p><p><b>Phone:</b> ${esc(c.phone)}</p><p><b>Total orders:</b> ${c.orders}</p>`,'Done');break}
case 'view-order':{const o=orders.find(x=>x.id===id);if(o)modal('Order '+o.id,`<p><b>Customer:</b> ${esc(o.customer)}</p><p><b>Items:</b> ${o.items}</p><p><b>Total:</b> ${money(o.total)}</p><p><b>Status:</b> ${badge(o.status)}</p><p><b>Date:</b> ${esc(o.date)}</p>`,'Close');break}
case 'edit-order':{const o=orders.find(x=>x.id===id);if(o)modal('Update Order Status',`<p>Order <b>#${o.id}</b> — ${esc(o.customer)}</p><div class="field"><label>Status</label><select name="status">${['Pending','Paid','Shipped','Cancelled'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></div>`,'Update Status',fd=>{o.status=fd.get('status');save();render();toast('Order status updated.')});break}
case 'filter-orders':orderFilter=b.dataset.value;render();break;
case 'export-orders':downloadCSV('honeybail-orders.csv',[['Order ID','Customer','Items','Total','Status','Date'],...orders.map(o=>[o.id,o.customer,o.items,o.total,o.status,o.date])]);break;
case 'export-products':downloadCSV('honeybail-products.csv',[['Product','Price','Stock'],...products.map(p=>[p.name,p.price,p.stock])]);break;
case 'go-reports':go('reports');break;
case 'clear-cart':if(confirm('Clear all cart activity?')){cartActivity=[];save();render();toast('Cart activity cleared.')}break;
case 'remove-favorite':favorites.splice(Number(id),1);save();render();toast('Favorite removed.');break;
case 'settings-tab':settingsTab=b.dataset.value;render();break;
case 'save-preferences':toast('Preferences saved for this demo.');break;
case 'change-logo':modal('Change Store Logo','<p>This frontend demo uses an emoji logo. Image upload can be connected when you add a backend.</p><div class="field"><label>Choose image</label><input type="file" accept="image/*" name="logo"></div>','Choose Image',fd=>{const f=fd.get('logo');if(f&&f.size)toast('Image selected. Save/upload handling needs a backend.')});break;
case 'close-modal':closeModal();break;
}}
);
document.addEventListener('input',e=>{if(e.target.id==='productSearch'){productSearch=e.target.value;const pos=e.target.selectionStart;render();const el=document.getElementById('productSearch');el.focus();el.setSelectionRange(pos,pos)}if(e.target.id==='customerSearch'){customerSearch=e.target.value;const pos=e.target.selectionStart;render();const el=document.getElementById('customerSearch');el.focus();el.setSelectionRange(pos,pos)}if(e.target.id==='orderSearch'){orderSearch=e.target.value;const pos=e.target.selectionStart;render();const el=document.getElementById('orderSearch');el.focus();el.setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{if(e.target.id==='orderFilter'){orderFilter=e.target.value;render()}});
document.addEventListener('submit',e=>{if(e.target.id==='settingsForm'){e.preventDefault();const fd=new FormData(e.target);settings={name:fd.get('name'),tagline:fd.get('tagline'),email:fd.get('email'),phone:fd.get('phone'),address:fd.get('address')};save();render();toast('Store settings saved.')}});
document.getElementById('menuToggle').addEventListener('click',()=>{document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('show')});
document.getElementById('overlay').addEventListener('click',()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show')});
document.getElementById('notificationBtn').addEventListener('click',()=>modal('Notifications','<p>🔔 You have new order activity.</p><p>📦 Check products with low stock.</p>','Done'));
document.getElementById('adminMenu').addEventListener('click',()=>modal('Admin Account','<p><b>Signed in as:</b> Admin</p><p>This is a frontend demo account menu.</p>','Close'));
document.getElementById('backStore').addEventListener('click',()=>modal('Store Preview','<p>Your customer-facing store can be connected here. This demo currently contains the admin frontend only.</p>','Close'));
render();
</script></body></html>
