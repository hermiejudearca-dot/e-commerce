
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Honeybail | Admin Panel</title>
<link rel="icon" href="data:,">

<style>
:root {
  --red:#a90f1a;
  --red2:#c51c28;
  --cream:#fffaf6;
  --ink:#29252a;
  --muted:#7c7778;
  --line:#eee5e1;
  --green:#dff5e6;
  --orange:#fff0d8;
  --blue:#e3efff;
  --shadow:0 8px 28px #4b10100b;
}

* { box-sizing:border-box; }

body {
  margin:0;
  background:#faf8f6;
  color:var(--ink);
  font:14px/1.45 Inter,Segoe UI,Arial,sans-serif;
}

button,input,select,textarea { font:inherit; }
button { cursor:pointer; }

.app { min-height:100vh; }

.topbar {
  height:64px;
  background:linear-gradient(90deg,#970b16,#b81723);
  color:white;
  display:flex;
  align-items:center;
  gap:18px;
  padding:0 22px;
  position:sticky;
  top:0;
  z-index:5;
  box-shadow:0 3px 12px #6b000020;
}

.brand {
  font-weight:900;
  letter-spacing:1.5px;
  font-size:20px;
  line-height:1;
}

.brand small {
  display:block;
  font-size:8px;
  letter-spacing:.6px;
  margin-top:4px;
}

.hamb {
  background:transparent;
  color:white;
  border:0;
  font-size:23px;
}

.top-title { font-size:13px; opacity:.95; }

.top-right {
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:16px;
}

.top-right button {
  background:transparent;
  border:0;
  color:white;
}

.layout {
  display:flex;
  min-height:calc(100vh - 64px);
}

.sidebar {
  width:220px;
  flex-shrink:0;
  background:#970d17;
  color:#fff;
  padding:16px 10px;
  display:flex;
  flex-direction:column;
  gap:5px;
}

.navbtn {
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  text-align:left;
  border:0;
  border-radius:8px;
  background:transparent;
  color:#f9e9e9;
  padding:12px 13px;
  font-size:13px;
  transition:.18s;
}

.navbtn:hover,.navbtn.active {
  background:#c32732;
  color:white;
}

.navbtn .ico {
  width:20px;
  font-size:17px;
  text-align:center;
}

.nav-spacer { flex:1; min-height:24px; }

.backstore {
  border-top:1px solid #ffffff26;
  padding-top:14px;
  margin-top:8px;
}

.main {
  padding:25px;
  flex:1;
  min-width:0;
  max-width:1800px;
  margin:0 auto;
  width:100%;
}

.pagehead {
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:14px;
  margin-bottom:20px;
}

.pagehead h1 {
  font-size:24px;
  margin:0 0 4px;
}

.sub { color:var(--muted); font-size:13px; }

.datepill {
  background:white;
  border:1px solid var(--line);
  padding:9px 12px;
  border-radius:9px;
  color:#8e151e;
}

.stats {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
  margin-bottom:18px;
}

.stat,.panel,.tablewrap {
  background:white;
  border:1px solid var(--line);
  border-radius:13px;
  box-shadow:var(--shadow);
}

.stat {
  padding:18px;
  display:flex;
  gap:13px;
  align-items:center;
}

.stat-icon {
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#f9e5e5;
  color:var(--red);
  font-size:20px;
}

.stat-label { font-size:12px; color:var(--muted); }
.stat strong { display:block; font-size:22px; margin:3px 0; }
.positive { font-size:11px; color:#19864a; }

.grid2 {
  display:grid;
  grid-template-columns:1.2fr 1fr;
  gap:16px;
  margin-bottom:16px;
}

.grid3 {
  display:grid;
  grid-template-columns:1.2fr 1fr .8fr;
  gap:16px;
  margin-bottom:16px;
}

.panel { padding:18px; min-width:0; }

.panelhead {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.panelhead h3 { margin:0; font-size:15px; }

.linkbtn {
  border:0;
  background:transparent;
  color:var(--red);
  font-weight:700;
  font-size:12px;
}

.chart { height:205px; width:100%; display:block; }
.recent-list { display:flex; flex-direction:column; }

.recent-row {
  display:grid;
  grid-template-columns:1.1fr 1fr .6fr .7fr;
  gap:8px;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid #f3eeeb;
  font-size:11px;
}

.recent-row:last-child { border:0; }

.badge {
  display:inline-block;
  border-radius:5px;
  padding:4px 8px;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}

.Pending { background:var(--orange); color:#b86a08; }
.Paid,.In-Stock,.Delivered { background:var(--green); color:#168046; }
.Shipped,.Processing { background:var(--blue); color:#1761b0; }
.Cancelled,.Low-Stock,.Failed { background:#ffe6e3; color:#bf392b; }

.tablewrap { overflow:auto; }

.toolbar {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:14px;
}

.toolbar input,.toolbar select,
.field input,.field select,.field textarea {
  border:1px solid #e6dedb;
  background:#fff;
  border-radius:8px;
  padding:10px 12px;
  outline:none;
  min-width:140px;
}

.toolbar input:focus,.field input:focus,
.field select:focus,.field textarea:focus {
  border-color:#c52a35;
  box-shadow:0 0 0 3px #c52a3510;
}

.primary,.secondary,.danger {
  border:0;
  border-radius:8px;
  padding:10px 14px;
  font-weight:700;
}

.primary { background:var(--red); color:white; }
.primary:hover { background:#830a13; }
.secondary { background:#f6ecea; color:#8f111a; }
.danger { background:#ffeded; color:#b51a25; }

.table {
  border-collapse:collapse;
  width:100%;
  white-space:nowrap;
}

.table th {
  background:#fffaf8;
  color:#777;
  font-size:11px;
  text-align:left;
  padding:13px 15px;
}

.table td {
  padding:13px 15px;
  border-top:1px solid #f0eae7;
  font-size:12px;
}

.table tr:hover td { background:#fffdfc; }

.actions { display:flex; gap:6px; }

.smallbtn {
  border:1px solid #eee0dc;
  background:white;
  border-radius:6px;
  padding:5px 8px;
  color:#7f111a;
}

.smallbtn:hover { background:#fff0ef; }

.product-cell {
  display:flex;
  align-items:center;
  gap:10px;
}

.product-emoji {
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  border-radius:9px;
  background:#fff0e8;
  font-size:20px;
  overflow:hidden;
  flex-shrink:0;
}

.product-emoji img {
  width:100%;
  height:100%;
  object-fit:cover;
}

.empty {
  text-align:center;
  color:var(--muted);
  padding:35px;
}

.formgrid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.field {
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field label { font-size:12px; font-weight:700; }
.field.full { grid-column:1/-1; }
.field textarea { min-height:85px; }

.settings-tabs {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.tab {
  border:1px solid var(--line);
  border-radius:8px;
  padding:9px 14px;
  background:white;
}

.tab.active {
  background:var(--red);
  color:white;
  border-color:var(--red);
}

.setting-layout {
  display:grid;
  grid-template-columns:200px 1fr;
  gap:25px;
}

.store-logo {
  width:110px;
  height:110px;
  background:#f7e4e2;
  color:var(--red);
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:42px;
  margin-bottom:12px;
}

.mutedbox {
  background:#fff9f6;
  border:1px solid var(--line);
  padding:14px;
  border-radius:9px;
  color:var(--muted);
}

.bar-chart {
  height:220px;
  display:flex;
  align-items:end;
  gap:13px;
  padding:12px 8px 0;
  border-bottom:1px solid var(--line);
}

.bar-col {
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:end;
  height:100%;
  gap:7px;
  font-size:10px;
  color:var(--muted);
}

.bar {
  width:70%;
  max-width:40px;
  background:linear-gradient(#d93642,#a70d19);
  border-radius:5px 5px 0 0;
  min-height:6px;
}

.bar-label { padding-bottom:8px; }

.quick-actions { display:grid; gap:9px; }

.quick-actions button {
  text-align:left;
  background:#fff8f6;
  border:1px solid #f4e2df;
  border-radius:8px;
  padding:12px;
  color:#8e121c;
}

.footer {
  padding:18px 0 0;
  color:#a49b98;
  font-size:11px;
  display:flex;
  justify-content:space-between;
}

.notice {
  padding:12px 14px;
  border-radius:8px;
  background:#e5f7e9;
  color:#166b37;
  margin-bottom:14px;
}

.error-notice {
  background:#ffeded;
  color:#a90f1a;
}

.modal-backdrop {
  position:fixed;
  inset:0;
  background:#1e1010a8;
  z-index:20;
  display:grid;
  place-items:center;
  padding:20px;
}

.modal {
  background:white;
  width:min(560px,100%);
  max-height:90vh;
  overflow:auto;
  border-radius:14px;
  padding:22px;
  box-shadow:0 20px 70px #0003;
}

.modalhead {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.modalhead h2 { margin:0; font-size:19px; }

.close {
  border:0;
  background:#f6eeee;
  border-radius:7px;
  padding:6px 10px;
}

.modal-actions {
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:18px;
}

.hidden { display:none!important; }
.mobile-overlay { display:none; }

@media(max-width:1050px) {
  .sidebar { width:190px; }
  .main { padding:18px; }
  .stats { grid-template-columns:repeat(2,1fr); }
  .grid3 { grid-template-columns:1fr 1fr; }
  .grid3 .panel:last-child { grid-column:1/-1; }
}

@media(max-width:720px) {
  .topbar { padding:0 13px; }
  .brand { font-size:16px; }
  .top-title { display:none; }
  .sidebar {
    position:fixed;
    z-index:10;
    top:64px;
    bottom:0;
    left:0;
    transform:translateX(-100%);
    transition:.2s;
    width:245px;
  }
  .sidebar.open { transform:translateX(0); }
  .mobile-overlay.show {
    display:block;
    position:fixed;
    inset:64px 0 0;
    background:#0006;
    z-index:9;
  }
  .main { padding:15px; }
  .stats { grid-template-columns:1fr 1fr; gap:9px; }
  .stat { padding:12px; gap:8px; }
  .stat-icon { width:34px; height:34px; }
  .stat strong { font-size:18px; }
  .grid2,.grid3 { grid-template-columns:1fr; }
  .grid3 .panel:last-child { grid-column:auto; }
  .pagehead h1 { font-size:21px; }
  .setting-layout { grid-template-columns:1fr; }
  .formgrid { grid-template-columns:1fr; }
  .field.full { grid-column:auto; }
  .datepill { display:none; }
}
</style>
</head>

<body>
<div class="app">
  <header class="topbar">
    <button class="hamb" id="menuToggle" aria-label="Toggle menu">☰</button>

    <div class="brand">
      HONEYBAIL
      <small>✦ SMALL TREATS, BIG HAPPINESS ✦</small>
    </div>

    <div class="top-title">Admin Panel</div>

    <div class="top-right">
      <button id="notificationBtn" title="Notifications">♧</button>
      <button id="adminMenu">◉ Admin⌄</button>
    </div>
  </header>

  <div class="mobile-overlay" id="overlay"></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <button class="navbtn active" data-page="dashboard">
        <span class="ico">⌂</span>Dashboard
      </button>

      <button class="navbtn" data-page="orders">
        <span class="ico">▣</span>Orders
      </button>

      <button class="navbtn" data-page="products">
        <span class="ico">◉</span>Products
      </button>

      <button class="navbtn" data-page="customers">
        <span class="ico">♟</span>Customers
      </button>

      <button class="navbtn" data-page="reports">
        <span class="ico">▥</span>Reports
      </button>

      <button class="navbtn" data-page="cart">
        <span class="ico">🛒</span>Cart Activity
      </button>

      <button class="navbtn" data-page="favorites">
        <span class="ico">♡</span>Favorites
      </button>

      <button class="navbtn" data-page="settings">
        <span class="ico">⚙</span>Settings
      </button>

      <div class="nav-spacer"></div>

      <button class="navbtn backstore" id="backStore">
        <span class="ico">↗</span>Back to Store
      </button>
    </aside>

    <main class="main" id="main"></main>
  </div>
</div>

<div id="modalRoot"></div>

<script>

// =====================================================
// DJANGO API CONFIGURATION
// =====================================================


const API_ORIGIN = window.DJANGO_API_URL || (
    ["localhost", "127.0.0.1"].includes(window.location.hostname) &&
    ["5500", "5501"].includes(window.location.port)
        ? "http://127.0.0.1:8000"
        : window.location.origin
);


const API = {
  products: `${API_ORIGIN}/api/products/`,
  dashboard: `${API_ORIGIN}/api/dashboard/`,
  orders: `${API_ORIGIN}/api/orders/`,
  customers: `${API_ORIGIN}/api/customers/`,
  reports: `${API_ORIGIN}/api/reports/`
};

const AUTH = {
  me: `${API_ORIGIN}/api/auth/me/`,
  login: `${API_ORIGIN}/api/auth/login/`,
  logout: `${API_ORIGIN}/api/auth/logout/`,
  register: `${API_ORIGIN}/api/auth/register/`
};

const ADMIN_API = {
  cartActivity: `${API_ORIGIN}/api/cart-activity/`,
  settings: `${API_ORIGIN}/api/settings/`
};


// =====================================================
// CSRF COOKIE HELPERS
// =====================================================

function getCookie(name) {
  const part = document.cookie
    .split('; ')
    .find(x => x.startsWith(name + '='));

  return part
    ? decodeURIComponent(part.slice(name.length + 1))
    : null;
}

async function ensureCsrfToken() {
  const response = await fetch(`${API_ORIGIN}/api/csrf/`, {
    credentials: 'include'
  });

  if (!response.ok) {
    throw new Error('Could not initialize CSRF protection.');
  }

  const token = getCookie('csrftoken');

  if (!token) {
    throw new Error(
      'CSRF cookie missing. Use 127.0.0.1 for both Live Server and Django.'
    );
  }

  return token;
}


// =====================================================
// GENERAL API REQUEST HELPER
// =====================================================

async function apiRequest(url, options = {}) {
  const method = (options.method || 'GET').toUpperCase();
  const headers = new Headers(options.headers || {});

  if (!['GET', 'HEAD', 'OPTIONS', 'TRACE'].includes(method)) {
    headers.set('X-CSRFToken', await ensureCsrfToken());
  }

  const response = await fetch(url, {
    ...options,
    method,
    headers,
    credentials: 'include'
  });

  let body = {};

  try {
    body = await response.json();
  } catch {}

  if (!response.ok) {
    throw new Error(
      body.error || `Request failed (${response.status})`
    );
  }

  return body;
}


// =====================================================
// ADMIN AUTHENTICATION
// =====================================================

let signedInUser = null;
let storeSettingsLoaded = false;

async function refreshAdminIdentity() {
  try {
    const data = await apiRequest(AUTH.me);
    signedInUser = data.user;
  } catch {
    signedInUser = null;
  }

  document.getElementById('adminMenu').textContent =
    signedInUser
      ? (signedInUser.is_staff ? '◉ Admin ▾' : '◉ Customer ▾')
      : '◉ Sign In';
}

function adminLoginModal() {
  modal('Admin Sign In', `
    <p class="sub">
      Sign in using your Django staff or superuser account.
    </p>

    <div class="field">
      <label>Email / username</label>
      <input
        name="email"
        required
        autocomplete="username"
      >
    </div>

    <div class="field">
      <label>Password</label>
      <input
        name="password"
        type="password"
        required
        autocomplete="current-password"
      >
    </div>
  `, 'Sign In', async fd => {
    await apiRequest(AUTH.login, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        email: fd.get('email'),
        password: fd.get('password')
      })
    });

    await refreshAdminIdentity();

    if (!signedInUser?.is_staff) {
      throw new Error(
        'This admin panel requires a staff account.'
      );
    }

    await loadAllData();
    showToast('Signed in successfully.');
  });
}


// =====================================================
// LOAD ADDITIONAL ADMIN INFORMATION
// =====================================================

async function loadAdminExtras() {
  if (!signedInUser?.is_staff) return;

  try {
    const data = await apiRequest(ADMIN_API.cartActivity);
    cartActivity = data.activities || [];
    clearError('cart');
  } catch (error) {
    showError('cart', error.message);
  }

  try {
    const data = await apiRequest(ADMIN_API.settings);
    const obj = data.settings || {};

    settings = {
      name: obj.store_name || 'HONEYBAIL',
      tagline: obj.tagline || '',
      email: obj.email || '',
      phone: obj.phone || '',
      address: obj.address || ''
    };

    storeSettingsLoaded = true;
    clearError('settings');
  } catch (error) {
    showError('settings', error.message);
  }
}


// =====================================================
// GLOBAL DATA
// =====================================================

let products = [];
let orders = [];
let customers = [];
let dashboardData = null;
let reportData = null;
let apiErrors = {};
let cartActivity = [];
let favorites = [];

let settings = {
  name: 'HONEYBAIL',
  tagline: 'Small Treats, Big Happiness',
  email: 'honeybail@gmail.com',
  phone: '',
  address: ''
};


// =====================================================
// PAGE STATE
// =====================================================

let currentPage = 'dashboard';
let orderFilter = 'All';
let productSearch = '';
let customerSearch = '';
let orderSearch = '';
let settingsTab = 'Store Info';
let cartNotice = '';


// =====================================================
// CURRENCY FORMATTER
// =====================================================

const money = n =>
  '₱' + Number(n || 0).toLocaleString('en-PH', {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });


// =====================================================
// HTML ESCAPE HELPER
// =====================================================

const esc = s =>
  String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[c]));


// =====================================================
// DATE FORMATTERS
// =====================================================

function formatDate(value) {
  if (!value) return '—';

  const d = new Date(value);

  if (Number.isNaN(d.getTime())) {
    return String(value);
  }

  return d.toLocaleString('en-PH', {
    year: 'numeric',
    month: 'short',
    day: 'numeric',
    hour: '2-digit',
    minute: '2-digit'
  });
}

function formatShortDate(value) {
  if (!value) return '—';

  const d = new Date(value);

  if (Number.isNaN(d.getTime())) {
    return String(value);
  }

  return d.toLocaleDateString('en-PH', {
    year: 'numeric',
    month: 'short',
    day: 'numeric'
  });
}


// =====================================================
// STATUS BADGE
// =====================================================

function badge(status) {
  const safe = String(status || 'Unknown');
  const cls = safe.replace(/[^a-zA-Z0-9_-]/g, '-');

  return `<span class="badge ${cls}">${esc(safe)}</span>`;
}


// =====================================================
// PAGE HEADER
// =====================================================

function head(title, sub, extra = '') {
  return `<div class="pagehead">
    <div>
      <h1>${title}</h1>
      <div class="sub">${sub}</div>
    </div>

    ${extra || `<div class="datepill">▣ &nbsp; ${
      esc(new Date().toLocaleDateString('en-PH', {
        month: 'short',
        day: 'numeric',
        year: 'numeric'
      }))
    }</div>`}
  </div>`;
}


// =====================================================
// TABLE GENERATOR
// =====================================================

function table(headers, rows) {
  return `<div class="tablewrap">
    <table class="table">
      <thead>
        <tr>
          ${headers.map(h => `<th>${h}</th>`).join('')}
        </tr>
      </thead>

      <tbody>
        ${rows || `<tr>
          <td colspan="${headers.length}" class="empty">
            No records found.
          </td>
        </tr>`}
      </tbody>
    </table>
  </div>`;
}


// =====================================================
// API ERROR HANDLING
// =====================================================

function showError(key, message) {
  apiErrors[key] = message;
  console.error(`Django API error (${key}):`, message);
}

function clearError(key) {
  delete apiErrors[key];
}

function errorBox(key) {
  if (!apiErrors[key]) return '';

  return `<div class="notice error-notice" role="alert">
    Could not load ${esc(key)}: ${esc(apiErrors[key])}

    <button
      class="secondary"
      data-action="reload-data"
      data-key="${esc(key)}"
    >
      Retry
    </button>
  </div>`;
}


// =====================================================
// TOAST NOTIFICATIONS
// =====================================================

function showToast(message, isError = false) {
  const node = document.createElement('div');

  node.className = 'notice' +
    (isError ? ' error-notice' : '');

  node.textContent = message;

  document.getElementById('main').prepend(node);

  setTimeout(() => node.remove(), 3500);
}

function productThumb(p) {
  if (p.image) {
    return `<img
      src="${esc(p.image)}"
      alt="${esc(p.name)}"
      onerror="this.style.display='none';this.parentElement.textContent='🍩'"
    >`;

}


// =====================================================
// NORMALIZE DJANGO ORDERS
// =====================================================

function normalizeOrder(o) {
  return {
    id: o.order_number || `HB-${String(o.id).padStart(4, '0')}`,
    dbId: o.id,
    customer: o.customer_name || o.customer || 'Guest',
    customerId: o.customer_id,
    items: Number(o.items_count || 0),
    total: Number(o.total_amount || o.total || 0),
    subtotal: Number(o.subtotal || 0),
    deliveryFee: Number(o.delivery_fee || 0),
    status: o.status || 'Pending',
    deliveryStatus: o.delivery_status || 'Not Shipped',
    paymentStatus: o.payment_status || 'Unpaid',
    paymentMethod: o.payment_method || 'COD',
    address: o.address || '',
    phone: o.phone || '',
    recipient: o.recipient || '',
    notes: o.notes || '',
    date: o.date_ordered || o.created_at || '',
    courierName: o.courier_name || '',
    trackingNumber: o.tracking_number || '',
    estimatedStart: o.estimated_delivery_start || '',
    estimatedEnd: o.estimated_delivery_end || '',
    deliveredAt: o.delivered_at || null,
    receivedAt: o.received_at || null,
    hasDeliveryProof: Boolean(o.has_delivery_proof),
    trackingEvents: Array.isArray(o.tracking_events)
      ? o.tracking_events
      : [],
    itemDetails: Array.isArray(o.items)
      ? o.items
      : []
  };
}


// =====================================================
// NORMALIZE CUSTOMER RECORDS
// =====================================================

function normalizeCustomer(c) {
  const matchingOrders = orders.filter(
    o => Number(o.customerId) === Number(c.id)
  );

  return {
    id: c.id,
    displayId: `CUST-${String(c.id).padStart(4, '0')}`,
    name: c.name || '—',
    email: c.email || '—',
    phone: '',
    orders: matchingOrders.length,
    joined: c.created_at || ''
  };
}


// =====================================================
// LOAD PRODUCTS
// =====================================================

async function loadProducts() {
  try {
    const data = await apiRequest(API.products);

    products = Array.isArray(data.products)
      ? data.products
      : [];

    clearError('products');

  } catch (error) {
    showError('products', error.message);
    products = [];
  }
}


// =====================================================
// LOAD STOREFRONT ORDERS
// =====================================================

async function loadOrders() {
  try {
    const data = await apiRequest(API.orders);

    orders = (
      Array.isArray(data.orders)
        ? data.orders
        : []
    ).map(normalizeOrder);

    clearError('orders');

    customers = customers.map(c => ({
      ...c,
      orders: orders.filter(
        o => Number(o.customerId) === Number(c.id)
      ).length
    }));

  } catch (error) {
    showError('orders', error.message);
    orders = [];
  }
}


// =====================================================
// LOAD CUSTOMERS
// =====================================================

async function loadCustomers() {
  try {
    const data = await apiRequest(API.customers);

    const raw = Array.isArray(data.customers)
      ? data.customers
      : [];

    customers = raw.map(normalizeCustomer);
    clearError('customers');

  } catch (error) {
    showError('customers', error.message);
    customers = [];
  }
}


// =====================================================
// LOAD DASHBOARD STATISTICS

async function loadDashboard() {
  try {

    clearError('dashboard');

// =====================================================
// LOAD SALES REPORTS
// =====================================================

async function loadReports() {
  try {

// =====================================================
// LOAD ALL DATABASE INFORMATION
// =====================================================

async function loadAllData() {
  await Promise.all([
    loadProducts(),
    loadOrders(),
    loadDashboard(),
    loadReports()
  ]);

  await loadCustomers();
  await loadAdminExtras();

  customers = customers.map(c => ({
    ...c,
    orders: orders.filter(
      o => Number(o.customerId) === Number(c.id)
    ).length
  }));

  render();
}


// =====================================================
// RELOAD INDIVIDUAL SECTIONS
// =====================================================

async function reloadOne(key) {
  if (key === 'products') {
    await loadProducts();
  }
  else if (key === 'orders') {
    await loadOrders();
  }
  else if (key === 'customers') {
    await loadOrders();
    await loadCustomers();
  }
  else if (key === 'dashboard') {
    await loadDashboard();
  }
  else if (key === 'reports') {
    await loadReports();
  }
  else {
    await loadAllData();
  }

  render();
}

const ORDER_STAGES = [
  'Pending',
  'Confirmed',
  'Processing',
  'Preparing',
  'Packed',
  'Shipped',
  'In Transit',
  'Out for Delivery',
  'Delivered'
];

function nextOrderStatus(status) {
  const index = ORDER_STAGES.indexOf(status);

  if (index < 0 || index >= ORDER_STAGES.length - 1) {
    return null;
  }

  return ORDER_STAGES[index + 1];
}

// =====================================================
// SALES OVERVIEW CHART
// =====================================================

function drawSalesChart() {
  const rows = reportData?.sales_by_month || [];

  if (!rows.length) {
    return `
      <div class="empty">
        No monthly sales data available yet.
        Paid orders are needed to display this chart.
      </div>
    `;
  }

  const values = rows.slice(-8);
  const numbers = values.map(
    row => Number(row.total_sales || 0)
  );

  const maximum = Math.max(...numbers, 1);

  const points = numbers.map((value, index) => ({
    x: 35 + index * (550 / Math.max(numbers.length - 1, 1)),
    y: 180 - (value / maximum) * 135,
    label: values[index].month
  }));

  const gridLines = [35, 75, 115, 155, 195]
    .map(y => `
      <line
        x1="25"
        y1="${y}"
        x2="590"
        y2="${y}"
        stroke="#eee8e5"
        stroke-dasharray="3 4"
      />
    `).join('');

  const coordinates = points.map(
    p => `${p.x},${p.y}`
  ).join(' ');

  const dots = points.map(p => `
    <circle
      cx="${p.x}"
      cy="${p.y}"
      r="4"
      fill="#c51c28"
    >
      <title>${esc(p.label)}</title>
    </circle>
  `).join('');

  return `
    <svg
      class="chart"
      viewBox="0 0 600 220"
      preserveAspectRatio="none"
      aria-label="Monthly sales chart"
    >
      ${gridLines}

      <polyline
        points="${coordinates}"
        fill="none"
        stroke="#c51c28"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      ${dots}

      <text
        x="25"
        y="214"
        font-size="10"
        fill="#8a8380"
      >
        ${esc(points[0]?.label || '')}
      </text>

      <text
        x="475"
        y="214"
        font-size="10"
        fill="#8a8380"
      >
        ${esc(points[points.length - 1]?.label || '')}
      </text>
    </svg>
  `;
}


// =====================================================
// TOP PRODUCTS
// =====================================================

function soldProducts() {
  const totals = new Map();

  orders.forEach(order => {
    (order.itemDetails || []).forEach(item => {
      const name = item.product_name || 'Unknown product';
      const quantity = Number(item.quantity || 0);

      totals.set(
        name,
        (totals.get(name) || 0) + quantity
      );
    });
  });

  return [...totals.entries()]
    .map(([name, quantity]) => ({
      name,
      quantity
    }))
    .sort((a, b) => b.quantity - a.quantity)
    .slice(0, 5);
}

function topProductsMarkup() {
  const sold = soldProducts();

  if (!sold.length) {
    return `
      <div class="empty">
        No product orders available yet.
      </div>
    `;
  }

  return sold.map(product => `
    <div
      class="recent-row"
      style="grid-template-columns:32px 1fr 30px"
    >
      <span class="product-emoji">🍩</span>
      <span>${esc(product.name)}</span>
      <b>${product.quantity}</b>
    </div>
  `).join('');
}

// ORDERS PAGE
// =====================================================

function renderOrders() {
  const statuses = [
    'All',
    ...ORDER_STAGES,
    'Completed',
    'Cancelled'
  ];

  const filteredOrders = orders.filter(order => {
    const matchesStatus =
      orderFilter === 'All' ||
      order.status === orderFilter;

    const searchText = [
      order.id,
      order.customer,
      order.paymentStatus,
      order.trackingNumber,
      order.courierName
    ].join(' ').toLowerCase();

    return matchesStatus &&
      searchText.includes(orderSearch.toLowerCase());
  });

  const statusOptions = statuses.map(status => `
    <option
      value="${esc(status)}"
      ${orderFilter === status ? 'selected' : ''}
    >
      ${esc(status)}
    </option>
  `).join('');

  const statusTabs = statuses.map(status => {
    const count = status === 'All'
      ? orders.length
      : orders.filter(o => o.status === status).length;

    return `
      <button
        class="tab ${orderFilter === status ? 'active' : ''}"
        data-action="filter-orders"
        data-value="${esc(status)}"
      >
        ${esc(status)} (${count})
      </button>
    `;
  }).join('');

  return `
    ${head(
      'Orders',
      'Monitor and manage customer orders.',
      `<button
        class="primary"
        data-action="export-orders"
      >
        ↓ Export CSV
      </button>`
    )}

    ${errorBox('orders')}

    <div class="toolbar">
      <input
        id="orderSearch"
        placeholder="⌕ Search by order ID, customer..."
        value="${esc(orderSearch)}"
      >

      <select id="orderFilter">
        ${statusOptions}
      </select>
    </div>

    <div class="settings-tabs">
      ${statusTabs}
    </div>

    ${table(
      [
        'Order ID',
        'Customer',
        'Items',
        'Total',
        'Status',
        'Date',
        'Action'
      ],
      orderRows(filteredOrders)
    )}
  `;
}

// =====================================================
// MODAL SYSTEM
// =====================================================

function closeModal() {
  document.getElementById('modalRoot').innerHTML = '';
}

function modal(title, content, submitText = null, onSubmit = null) {
  const root = document.getElementById('modalRoot');

  root.innerHTML = `
    <div class="modal-backdrop">
      <div class="modal">
        <div class="modalhead">
          <h2>${esc(title)}</h2>

          <button
            type="button"
            class="close"
            id="closeModalBtn"
            aria-label="Close modal"
          >✕</button>
        </div>

        <form id="modalForm">
          ${content}

          <div class="modal-actions">
            <button
              type="button"
              class="secondary"
              id="cancelModalBtn"
            >
              Close
            </button>

            ${submitText ? `
              <button
                type="submit"
                class="primary"
                id="modalSubmitBtn"
              >
                ${esc(submitText)}
              </button>
            ` : ''}
          </div>
        </form>
      </div>
    </div>
  `;

  document.getElementById('closeModalBtn')
    .addEventListener('click', closeModal);

  document.getElementById('cancelModalBtn')
    .addEventListener('click', closeModal);

  root.querySelector('.modal-backdrop')
    .addEventListener('click', event => {
      if (event.target.classList.contains('modal-backdrop')) {
        closeModal();
      }
    });

  document.getElementById('modalForm')
    .addEventListener('submit', async event => {
      event.preventDefault();

      if (!onSubmit) return;

      const form = event.currentTarget;
      const button = document.getElementById('modalSubmitBtn');
      const formData = new FormData(form);

      if (button) {
        button.disabled = true;
        button.textContent = 'Saving...';
      }

      try {
        await onSubmit(formData);
        closeModal();
      } catch (error) {
        showToast(error.message, true);

        if (button) {
          button.disabled = false;
          button.textContent = submitText || 'Save';
        }
      }
    });
}

// =====================================================
// ARCHIVE PRODUCT
// =====================================================

async function deleteProduct(productId) {
  const product = products.find(
    p => Number(p.id) === Number(productId)
  );

  if (!product) {
    showToast('Product not found.', true);
    return;
  }

  const confirmed = confirm(
    `Archive "${product.name}"?\n\n` +
    'The product will be hidden from the customer store, ' +
    'but its database record will be preserved.'
  );

  if (!confirmed) return;

  try {
    await apiRequest(
      `${API.products}${productId}/`,
      { method: 'DELETE' }
    );

    await loadProducts();
    await loadDashboard();
    render();

    showToast('Product archived successfully.');
  } catch (error) {
    showToast(error.message, true);
  }
}

  const rows = items.map(item => {

    return `
      <tr>
        <td>${esc(item.product_name || item.name)}</td>
        <td>${quantity}</td>
        <td>${money(unitPrice)}</td>

  return table(
    ['Product', 'Quantity', 'Unit Price', 'Subtotal'],
    rows
  );

// =====================================================
// ORDER MANAGEMENT EDITOR
// =====================================================

function editOrder(orderId) {
  const order = findOrder(orderId);

  if (!order) {
    showToast('Order not found.', true);
    return;
  }

  if (['Completed', 'Cancelled'].includes(order.status)) {
    viewOrder(orderId);
    return;
  }

  const nextStatus = nextOrderStatus(order.status);

  const paymentOptions = [
    'Unpaid',
    'Pending Verification',
    'Paid',
    'Failed'
  ];

  const paymentMarkup = paymentOptions.map(status => `
    <option
      value="${esc(status)}"
      ${order.paymentStatus === status ? 'selected' : ''}
    >
      ${esc(status)}
    </option>
  `).join('');

  const statusMarkup = nextStatus
    ? `
      <div class="field full">
        <label>Advance Order Status</label>

        <select name="status">
          <option value="">
            Keep Current: ${esc(order.status)}
          </option>

          <option value="${esc(nextStatus)}">
            Advance to: ${esc(nextStatus)}
          </option>
        </select>

        <div class="sub">
          Orders advance one stage at a time.
        </div>
      </div>
    `
    : `
      <div class="mutedbox">
        This order has reached Delivered status.
        Customer receipt confirmation will be
        handled through the storefront.
      </div>
    `;

  const content = `
    <div class="mutedbox">
      <b>Order:</b> #${esc(order.id)}

      <div style="margin-top:6px">
        <b>Customer:</b> ${esc(order.customer)}
      </div>

      <div style="margin-top:6px">
        <b>Current Status:</b>
        ${badge(order.status)}
      </div>
    </div>

    <div class="formgrid" style="margin-top:15px">
      ${statusMarkup}

      <div class="field full">
        <label>Payment Status</label>

        <select name="payment_status">
          ${paymentMarkup}
        </select>
      </div>

      <div class="field">
        <label>Courier Name</label>

        <input
          name="courier_name"
          maxlength="120"
          value="${esc(order.courierName)}"
          placeholder="e.g. J&T Express"
        >
      </div>

      <div class="field">
        <label>Tracking Number</label>

        <input
          name="tracking_number"
          maxlength="150"
          value="${esc(order.trackingNumber)}"
          placeholder="Courier tracking number"
        >
      </div>

      <div class="field">
        <label>Estimated Delivery Start</label>

        <input
          name="estimated_delivery_start"
          type="date"
          value="${esc(order.estimatedStart)}"
        >
      </div>

      <div class="field">
        <label>Estimated Delivery End</label>

        <input
          name="estimated_delivery_end"
          type="date"
          value="${esc(order.estimatedEnd)}"
        >
      </div>

      <div class="field full">
        <label>Tracking Update Message</label>

        <textarea
          name="tracking_message"
          maxlength="1000"
          placeholder="e.g. Package has been picked up by courier."
        ></textarea>
      </div>

      <div class="field full">
        <label>Tracking Location (Optional)</label>

        <input
          name="tracking_location"
          maxlength="200"
          placeholder="e.g. Iloilo City sorting facility"
        >
      </div>
    </div>
  `;

  modal(
    'Manage Order',
    content,
    'Save Order Changes',
    async formData => {
      const changes = {};

      const newStatus = String(
        formData.get('status') || ''
      ).trim();

      if (newStatus && newStatus !== order.status) {
        changes.status = newStatus;
      }

      const newPayment = String(
        formData.get('payment_status') || ''
      );

      if (newPayment !== order.paymentStatus) {
        changes.payment_status = newPayment;
      }

      const courier = String(
        formData.get('courier_name') || ''
      ).trim();

      if (courier !== order.courierName) {
        changes.courier_name = courier;
      }

      const trackingNumber = String(
        formData.get('tracking_number') || ''
      ).trim();

      if (trackingNumber !== order.trackingNumber) {
        changes.tracking_number = trackingNumber;
      }

      const start = String(
        formData.get('estimated_delivery_start') || ''
      );

      const end = String(
        formData.get('estimated_delivery_end') || ''
      );

      if (start !== order.estimatedStart) {
        changes.estimated_delivery_start = start;
      }

      if (end !== order.estimatedEnd) {
        changes.estimated_delivery_end = end;
      }

      const message = String(
        formData.get('tracking_message') || ''
      ).trim();

      const location = String(
        formData.get('tracking_location') || ''
      ).trim();

      if (message) {
        changes.tracking_message = message;
      }

      if (location) {
        changes.tracking_location = location;
      }

      if (!Object.keys(changes).length) {
        showToast('No changes were made.');
        return;
      }

      await apiRequest(
        `${API.orders}${order.dbId}/`,
        {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(changes)
        }
      );

      await Promise.all([
        loadOrders(),
        loadDashboard(),
        loadReports()
      ]);

      render();
      showToast('Order updated successfully.');
    }
  );
}

// CSV EXPORT HELPERS
// =====================================================

function csvCell(value) {
  const text = String(value ?? '');

  // Prevent spreadsheet applications from interpreting
  // untrusted customer data as formulas.
  const safe = /^[\s]*[=+\-@\t\r]/.test(text)
    ? "'" + text
    : text;

  return `"${safe.replace(/"/g, '""')}"`;
}

function exportCsv(filename, headers, rows) {
  const csv = [
    headers.map(csvCell).join(','),
    ...rows.map(row => row.map(csvCell).join(','))
  ].join('\r\n');

  const blob = new Blob(
    ['\uFEFF', csv],
    { type: 'text/csv;charset=utf-8;' }
  );

  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');

  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// =====================================================
// CUSTOMER DETAILS
// =====================================================

function viewCustomer(customerId) {
  const customer = customers.find(
    c => Number(c.id) === Number(customerId)
  );

  if (!customer) {
    showToast('Customer not found.', true);
    return;
  }

  const customerOrders = orders.filter(
    order =>
      Number(order.customerId) === Number(customer.id)
  );

  const rows = customerOrders.map(order => `
    <tr>
      <td>${esc(order.id)}</td>
      <td>${money(order.total)}</td>
      <td>${badge(order.status)}</td>
      <td>${esc(formatShortDate(order.date))}</td>
    </tr>
  `).join('');

  modal(
    'Customer Details',
    `
      <div class="mutedbox">
        <p><b>Customer ID:</b> ${esc(customer.displayId)}</p>
        <p><b>Name:</b> ${esc(customer.name)}</p>
        <p><b>Email:</b> ${esc(customer.email)}</p>
        <p><b>Orders:</b> ${customerOrders.length}</p>
        <p><b>Joined:</b> ${esc(formatDate(customer.joined))}</p>
      </div>

      <h3>Order History</h3>

      ${table(
        ['Order ID', 'Total', 'Status', 'Date'],
        rows
      )}
    `
  );
}


// =====================================================
// SAVE STORE SETTINGS
// =====================================================

async function saveStoreSettings(form) {
  const data = new FormData(form);

  const payload = {
    store_name: String(data.get('store_name') || '').trim(),
    tagline: String(data.get('tagline') || '').trim(),
    email: String(data.get('email') || '').trim(),
    phone: String(data.get('phone') || '').trim(),
    address: String(data.get('address') || '').trim()
  };

  if (!payload.store_name) {
    showToast('Store name is required.', true);
    return;
  }

  try {
    await apiRequest(ADMIN_API.settings, {
      method: 'PATCH',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(payload)
    });

    settings = {
      name: payload.store_name,
      tagline: payload.tagline,
      email: payload.email,
      phone: payload.phone,
      address: payload.address
    };

    render();
    showToast('Store information saved successfully.');

  } catch (error) {
    showToast(error.message, true);
  }
}


// =====================================================
// NAVIGATION
// =====================================================

function navigate(page) {
  const validPages = [
    'dashboard',
    'orders',
    'products',
    'customers',
    'reports',
    'cart',
    'favorites',
    'settings'
  ];

  if (!validPages.includes(page)) return;

  currentPage = page;
  render();

  document.getElementById('sidebar')
    .classList.remove('open');

  document.getElementById('overlay')
    .classList.remove('show');

  window.scrollTo({ top: 0, behavior: 'smooth' });
}


// =====================================================
// CLICK EVENT HANDLERS
// =====================================================

document.addEventListener('click', async event => {
  const button = event.target.closest(
    '[data-page], [data-action]'
  );

  if (!button) return;

  if (button.dataset.page) {
    navigate(button.dataset.page);
    return;
  }

  const action = button.dataset.action;
  const id = Number(button.dataset.id);

  try {
    switch (action) {

      case 'add-product':
        productEditor();
        break;

      case 'edit-product': {
        const product = products.find(
          p => Number(p.id) === id
        );

        if (!product) {
          showToast('Product not found.', true);
          return;
        }

        productEditor(product);
        break;
      }

      case 'delete-product':
        await deleteProduct(id);
        break;

      case 'view-order':
        viewOrder(id);
        break;

      case 'edit-order':
        editOrder(id);
        break;

      case 'view-customer':
        viewCustomer(id);
        break;

      case 'filter-orders':
        orderFilter = button.dataset.value || 'All';
        render();
        break;

      case 'settings-tab':
        settingsTab = button.dataset.value || 'Store Info';
        render();
        break;

      case 'export-orders':
        exportOrders();
        break;

      case 'export-products':
        exportProducts();
        break;

      case 'export-customers':
        exportCustomers();
        break;

      case 'export-reports':
        exportReports();
        break;

      case 'refresh-cart':
        await loadAdminExtras();
        render();
        showToast('Cart activity refreshed.');
        break;

      case 'reload-data':
        await reloadOne(button.dataset.key);
        break;

      default:
        console.warn('Unknown action:', action);
    }

  } catch (error) {
    console.error(error);
    showToast(error.message, true);
  }
});


// =====================================================
// SEARCH AND FILTER INPUTS
// =====================================================

document.addEventListener('input', event => {
  const target = event.target;

  if (target.id === 'productSearch') {
    productSearch = target.value;

    const position = target.selectionStart;
    render();

    const replacement =
      document.getElementById('productSearch');

    replacement?.focus();
    replacement?.setSelectionRange(position, position);
  }

  if (target.id === 'orderSearch') {
    orderSearch = target.value;

    const position = target.selectionStart;
    render();

    const replacement =
      document.getElementById('orderSearch');

    replacement?.focus();
    replacement?.setSelectionRange(position, position);
  }

  if (target.id === 'customerSearch') {
    customerSearch = target.value;

    const position = target.selectionStart;
    render();

    const replacement =
      document.getElementById('customerSearch');

    replacement?.focus();
    replacement?.setSelectionRange(position, position);
  }
});

document.addEventListener('change', event => {
  if (event.target.id === 'orderFilter') {
    orderFilter = event.target.value;
    render();
  }
});

// =====================================================
// ADMIN MENU AND LOGOUT
// =====================================================

document.getElementById('adminMenu')
  .addEventListener('click', async () => {
    if (!signedInUser) {
      adminLoginModal();
      return;
    }

    const confirmed = confirm(
      'Do you want to sign out of the Honeybail Admin Panel?'
    );

    if (!confirmed) return;

    try {
      await apiRequest(AUTH.logout, {
        method: 'POST'
      });

      signedInUser = null;

      products = [];
      orders = [];
      customers = [];
      dashboardData = null;
      reportData = null;
      cartActivity = [];
      favorites = [];

      await refreshAdminIdentity();

      document.getElementById('main').innerHTML = `
        <div class="panel">
          <h2>Signed Out</h2>
          <p>Please sign in to access the admin panel.</p>

          <button
            class="primary"
            id="signInAgain"
          >
            Sign In
          </button>
        </div>
      `;

      document.getElementById('signInAgain')
        .addEventListener('click', adminLoginModal);

      showToast('Signed out successfully.');

    } catch (error) {
      showToast(error.message, true);
    }
  });


// =====================================================
// NOTIFICATIONS

document.getElementById('notificationBtn')
  .addEventListener('click', () => {
    const pending = orders.filter(
      order => order.status === 'Pending'
    ).length;

    const delivery = orders.filter(
      order => order.status === 'Out for Delivery'
    ).length;

    modal(
      'Order Notifications',
      `
        <div class="mutedbox">
          <p>
            <b>Pending Orders:</b> ${pending}
          </p>

          <p>
            <b>Out for Delivery:</b> ${delivery}
          </p>

          <p class="sub">
            These counts are based on the latest
            loaded Django order data.
          </p>
        </div>
      `
    );
  });


// =====================================================
// ADMIN STARTUP
// =====================================================

async function initializeAdmin() {
  document.getElementById('main').innerHTML = `
    <div class="panel">
      <h2>Loading Honeybail...</h2>
      <p class="sub">
        Checking your Django admin session.
      </p>
    </div>
  `;

  await refreshAdminIdentity();

  if (!signedInUser?.is_staff) {
    document.getElementById('main').innerHTML = `
      <div class="panel">
        <h2>Admin Sign In Required</h2>

        <p class="sub">
          Sign in using a Django staff or
          superuser account to continue.
        </p>

        <button
          class="primary"
          id="initialSignIn"
        >
          Sign In
        </button>
      </div>
    `;

    document.getElementById('initialSignIn')
      .addEventListener('click', adminLoginModal);

    return;
  }

  await loadAllData();
}

initializeAdmin().catch(error => {
  console.error('Admin initialization failed:', error);

  document.getElementById('main').innerHTML = `
    <div class="panel">
      <h2>Could Not Load Admin Panel</h2>

      <p class="sub">
        ${esc(error.message)}
      </p>

      <button
        class="primary"
        id="retryInitialization"
      >
        Try Again
      </button>
    </div>
  `;

  document.getElementById('retryInitialization')
    .addEventListener('click', initializeAdmin);
});
